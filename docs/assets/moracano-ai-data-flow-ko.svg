<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Moracano AI 데이터 흐름</title>
  <desc id="desc">공공 방언 데이터와 사용자 음성을 온디바이스에서 분석해 다감각 경험과 구조화된 방언 아카이브로 연결하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#1B1A18"/>
    </marker>
    <marker id="arrow-green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#129034"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1A18" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 800 58px 'Arial Narrow', 'Noto Sans KR', sans-serif; fill: #1B1A18; letter-spacing: -1px; }
      .subtitle { font: 600 25px 'Noto Sans KR', sans-serif; fill: #56524B; }
      .lane-no { font: 800 40px 'Arial Narrow', sans-serif; fill: #129034; }
      .lane-title { font: 800 31px 'Noto Sans KR', sans-serif; fill: #1B1A18; }
      .card-title { font: 800 22px 'Noto Sans KR', sans-serif; fill: #1B1A18; }
      .card-title-inverse { font: 800 22px 'Noto Sans KR', sans-serif; fill: #FFFFFF; }
      .card-copy { font: 500 16px 'Noto Sans KR', sans-serif; fill: #56524B; }
      .card-copy-inverse { font: 600 16px 'Noto Sans KR', sans-serif; fill: #FFFFFF; }
      .mini { font: 700 15px 'Noto Sans KR', sans-serif; fill: #129034; }
      .pill { font: 700 14px 'Noto Sans KR', sans-serif; fill: #129034; }
      .line { fill: none; stroke: #1B1A18; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .green-line { fill: none; stroke: #129034; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .soft-line { fill: none; stroke: #6A6762; stroke-width: 1.75; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#FFFFFF"/>
  <circle cx="1640" cy="70" r="13" fill="#2DB755"/>
  <circle cx="1608" cy="92" r="8" fill="#8FE670"/>
  <circle cx="1672" cy="104" r="5" fill="#129034"/>
  <path d="M74 104V52C74 39 85 28 98 28C111 28 122 39 122 52V104" stroke="#1B1A18" stroke-width="20" stroke-linecap="round"/>
  <path d="M97 30C103 10 116 4 132 3C130 19 121 29 97 30Z" fill="#8FE670"/>
  <path d="M119 35C138 27 151 32 160 42C146 51 132 49 119 35Z" fill="#2DB755"/>
  <path d="M98 104L70 135M98 104L84 142M98 104V147M98 104L113 142M98 104L127 135" stroke="#1B1A18" stroke-width="5" stroke-linecap="round"/>
  <text x="196" y="78" class="title">MORACANO AI 데이터 흐름</text>
  <text x="198" y="118" class="subtitle">공공 방언 데이터와 살아있는 목소리를 하나의 방언 아카이브로</text>
  <rect x="1450" y="28" width="250" height="46" rx="12" fill="#129034"/>
  <text x="1575" y="58" text-anchor="middle" class="card-copy-inverse">온디바이스 분석 · AI 서버 없음</text>

  <!-- 01 Public data lane -->
  <rect x="36" y="166" width="1728" height="214" rx="28" fill="#F6F6F6" stroke="#1B1A18" stroke-width="2"/>
  <text x="72" y="220" class="lane-no">01</text>
  <text x="130" y="220" class="lane-title">공공 방언 데이터 준비</text>
  <rect x="72" y="250" width="310" height="94" rx="18" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="96" y="286" class="card-title">공공데이터</text>
  <text x="96" y="316" class="card-copy">AI-Hub 방언 문장 · 표준어 문장</text>
  <path d="M382 297H452" class="line"/>
  <rect x="456" y="250" width="326" height="94" rx="18" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="480" y="286" class="card-title">경상북도 지역 메타데이터</text>
  <text x="480" y="316" class="card-copy">지역 · 표준형 · 방언 표현 연결</text>
  <path d="M782 297H852" class="line"/>
  <rect x="856" y="236" width="408" height="122" rx="20" fill="#129034" filter="url(#shadow)"/>
  <text x="884" y="279" class="card-title-inverse">방언 아카이브 플랫폼</text>
  <text x="884" y="310" class="card-copy-inverse">기준 방언 사전과 실제 발화를 함께 탐색</text>
  <text x="884" y="335" class="card-copy-inverse">지역별 언어 데이터를 지속적으로 축적</text>
  <path d="M1264 280H1352" class="green-line"/>
  <rect x="1356" y="238" width="178" height="56" rx="16" fill="#FFFFFF" stroke="#129034" stroke-width="2"/>
  <text x="1445" y="273" text-anchor="middle" class="mini">방언 지도</text>
  <path d="M1264 318H1352" class="green-line"/>
  <rect x="1356" y="306" width="302" height="56" rx="16" fill="#FFFFFF" stroke="#129034" stroke-width="2"/>
  <text x="1507" y="341" text-anchor="middle" class="mini">지역별 음성 데이터베이스</text>

  <!-- 02 Runtime lane -->
  <rect x="36" y="400" width="1728" height="444" rx="28" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="72" y="454" class="lane-no">02</text>
  <text x="130" y="454" class="lane-title">사용자 음성을 Dialect Root로 변환</text>
  <rect x="72" y="490" width="228" height="108" rx="18" fill="#F6F6F6" stroke="#1B1A18" stroke-width="2"/>
  <text x="96" y="532" class="card-title">사용자</text>
  <text x="96" y="563" class="card-copy">지역을 선택하고</text>
  <text x="96" y="586" class="card-copy">짧은 방언 문장을 녹음</text>
  <path d="M300 544H356" class="line"/>
  <rect x="360" y="478" width="264" height="132" rx="18" fill="#F6F6F6" stroke="#1B1A18" stroke-width="2"/>
  <text x="384" y="519" class="card-title">지역 선택 · 음성 녹음</text>
  <text x="384" y="551" class="card-copy">제시문을 알고 있는 상태에서</text>
  <text x="384" y="576" class="card-copy">iPhone으로 살아있는 발화 수집</text>
  <path d="M492 610V626" class="soft-line"/>
  <rect x="360" y="626" width="264" height="52" rx="14" fill="#FFFFFF" stroke="#6A6762" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="492" y="658" text-anchor="middle" class="card-copy">비공개 원본 음성 보관</text>
  <path d="M624 544H680" class="line"/>
  <rect x="684" y="478" width="332" height="132" rx="18" fill="#129034" filter="url(#shadow)"/>
  <text x="710" y="519" class="card-title-inverse">온디바이스 음성 분석</text>
  <text x="710" y="551" class="card-copy-inverse">전처리 → 음절 강제정렬</text>
  <text x="710" y="578" class="card-copy-inverse">운율 분석 → 해석 가능한 라벨</text>
  <path d="M1016 544H1072" class="green-line"/>
  <rect x="1076" y="478" width="282" height="132" rx="18" fill="#F6F6F6" stroke="#1B1A18" stroke-width="2"/>
  <text x="1100" y="519" class="card-title">운율 분석기</text>
  <text x="1100" y="551" class="card-copy">음절별 높낮이 · 길이 · 리듬을</text>
  <text x="1100" y="576" class="card-copy">화자 기준으로 비교 가능하게 계산</text>

  <path d="M1217 610V654H827" class="line"/>
  <rect x="580" y="658" width="246" height="78" rx="16" fill="#FFFFFF" stroke="#2DB755" stroke-width="2"/>
  <text x="703" y="690" text-anchor="middle" class="card-title">피치 추출</text>
  <text x="703" y="716" text-anchor="middle" class="card-copy">상승 · 하강 · 음역</text>
  <rect x="846" y="658" width="246" height="78" rx="16" fill="#FFFFFF" stroke="#2DB755" stroke-width="2"/>
  <text x="969" y="690" text-anchor="middle" class="card-title">길이 분석</text>
  <text x="969" y="716" text-anchor="middle" class="card-copy">음절별 발음 시간</text>
  <rect x="1112" y="658" width="246" height="78" rx="16" fill="#FFFFFF" stroke="#2DB755" stroke-width="2"/>
  <text x="1235" y="690" text-anchor="middle" class="card-title">리듬 분석</text>
  <text x="1235" y="716" text-anchor="middle" class="card-copy">음절 사이 길이 변화</text>
  <path d="M703 736V770H1388" class="line"/>
  <path d="M969 736V770H1388" class="line"/>
  <path d="M1235 736V770H1388" class="line"/>
  <rect x="1392" y="654" width="302" height="126" rx="20" fill="#129034" filter="url(#shadow)"/>
  <text x="1420" y="698" class="card-title-inverse">Dialect Root 생성</text>
  <text x="1420" y="730" class="card-copy-inverse">지역 · 음절 타이밍 · 피치</text>
  <text x="1420" y="756" class="card-copy-inverse">길이 · 리듬 · 라벨 · 햅틱</text>

  <!-- 03 Output lane -->
  <rect x="36" y="864" width="1728" height="208" rx="28" fill="#F6F6F6" stroke="#1B1A18" stroke-width="2"/>
  <text x="72" y="918" class="lane-no">03</text>
  <text x="130" y="918" class="lane-title">경험으로 돌려주고 아카이브로 축적</text>
  <rect x="72" y="956" width="264" height="84" rx="18" fill="#129034"/>
  <text x="96" y="990" class="card-title-inverse">나의 Dialect Root</text>
  <text x="96" y="1017" class="card-copy-inverse">한 번의 발화를 하나의 뿌리로</text>
  <rect x="356" y="956" width="226" height="84" rx="18" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="380" y="990" class="card-title">음성 재생</text>
  <text x="380" y="1017" class="card-copy">원본 목소리 듣기</text>
  <rect x="602" y="956" width="226" height="84" rx="18" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="626" y="990" class="card-title">피치 시각화</text>
  <text x="626" y="1017" class="card-copy">글자의 움직임으로 보기</text>
  <rect x="848" y="956" width="226" height="84" rx="18" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="872" y="990" class="card-title">햅틱 패턴</text>
  <text x="872" y="1017" class="card-copy">억양과 길이를 진동으로</text>
  <rect x="1094" y="956" width="400" height="84" rx="18" fill="#FFFFFF" stroke="#129034" stroke-width="2"/>
  <text x="1118" y="990" class="card-title">구조화된 음성 아카이브</text>
  <text x="1118" y="1017" class="card-copy">분석 결과와 지역 정보를 함께 저장</text>

  <rect x="36" y="1092" width="640" height="4" rx="2" fill="#129034"/>
  <rect x="676" y="1092" width="1088" height="4" rx="2" fill="#E7E6E5"/>
</svg>
