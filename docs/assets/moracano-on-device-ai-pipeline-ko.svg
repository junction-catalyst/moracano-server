<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Moracano 온디바이스 음성 AI</title>
  <desc id="desc">입력 준비, 음절 정렬, 운율 분석, 특징 해석, 다감각 경험 생성의 다섯 단계</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#1B1A18"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1B1A18" flood-opacity="0.09"/></filter>
    <style>
      .title { font: 800 58px 'Arial Narrow', 'Noto Sans KR', sans-serif; fill: #1B1A18; }
      .subtitle { font: 600 24px 'Noto Sans KR', sans-serif; fill: #56524B; }
      .step { font: 800 38px 'Arial Narrow', sans-serif; fill: #129034; }
      .step-light { font: 800 38px 'Arial Narrow', sans-serif; fill: #8FE670; }
      .card-title { font: 800 27px 'Noto Sans KR', sans-serif; fill: #1B1A18; }
      .card-title-inverse { font: 800 27px 'Noto Sans KR', sans-serif; fill: #FFFFFF; }
      .item { font: 700 17px 'Noto Sans KR', sans-serif; fill: #1B1A18; }
      .item-inverse { font: 700 17px 'Noto Sans KR', sans-serif; fill: #FFFFFF; }
      .copy { font: 500 15px 'Noto Sans KR', sans-serif; fill: #56524B; }
      .copy-inverse { font: 600 15px 'Noto Sans KR', sans-serif; fill: #FFFFFF; }
      .metric { font: 800 36px 'Arial Narrow', sans-serif; fill: #8FE670; }
      .metric-label { font: 700 13px 'Noto Sans KR', sans-serif; fill: #FFFFFF; }
      .pill { font: 800 14px 'Noto Sans KR', sans-serif; fill: #129034; }
      .arrow { stroke: #1B1A18; stroke-width: 1.75; stroke-linecap: round; marker-end: url(#arrow); }
      .rule { stroke: #D6D4D1; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1800" height="980" fill="#FFFFFF"/>
  <path d="M76 111V58C76 45 87 34 100 34C113 34 124 45 124 58V111" stroke="#1B1A18" stroke-width="20" stroke-linecap="round"/>
  <path d="M99 36C105 16 118 10 134 9C132 25 123 35 99 36Z" fill="#8FE670"/>
  <path d="M121 41C140 33 153 38 162 48C148 57 134 55 121 41Z" fill="#2DB755"/>
  <path d="M100 111L72 142M100 111L86 149M100 111V154M100 111L115 149M100 111L129 142" stroke="#1B1A18" stroke-width="5" stroke-linecap="round"/>
  <text x="198" y="79" class="title">MORACANO 온디바이스 음성 AI</text>
  <text x="200" y="121" class="subtitle">제시문 기반 음절 정렬 · 화자 맞춤 운율 분석 · 다감각 출력</text>
  <rect x="1450" y="28" width="272" height="48" rx="12" fill="#129034"/>
  <text x="1586" y="59" text-anchor="middle" class="item-inverse">CORE ML · INT8 · iOS 18</text>

  <rect x="36" y="166" width="1728" height="554" rx="28" fill="#F6F6F6" stroke="#1B1A18" stroke-width="2"/>
  <line x1="316" y1="440" x2="338" y2="440" class="arrow"/>
  <line x1="642" y1="440" x2="664" y2="440" class="arrow"/>
  <line x1="1000" y1="440" x2="1022" y2="440" class="arrow"/>
  <line x1="1326" y1="440" x2="1348" y2="440" class="arrow"/>

  <rect x="64" y="198" width="246" height="490" rx="22" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="86" y="246" class="step">01</text>
  <text x="86" y="294" class="card-title">입력 준비</text>
  <text x="86" y="350" class="item">제시문</text><line x1="86" y1="369" x2="288" y2="369" class="rule"/>
  <text x="86" y="404" class="item">사용자 녹음</text><line x1="86" y1="423" x2="288" y2="423" class="rule"/>
  <text x="86" y="458" class="item">16kHz mono Float32</text><line x1="86" y1="477" x2="288" y2="477" class="rule"/>
  <text x="86" y="512" class="item">0.5–15초</text>
  <text x="86" y="572" class="copy">한글을 자모 단위로 나누고</text>
  <text x="86" y="596" class="copy">녹음마다 음량을 정규화합니다.</text>
  <text x="86" y="620" class="copy">제시문을 알고 있어 다시</text>
  <text x="86" y="644" class="copy">받아쓰지 않습니다.</text>

  <rect x="344" y="198" width="292" height="490" rx="22" fill="#129034" filter="url(#shadow)"/>
  <text x="366" y="246" class="step-light">02</text>
  <text x="366" y="294" class="card-title-inverse">음절 강제정렬</text>
  <text x="366" y="350" class="item-inverse">Korean Jamo wav2vec2</text>
  <line x1="366" y1="369" x2="614" y2="369" stroke="#8FE670" stroke-width="1"/>
  <text x="366" y="404" class="item-inverse">Core ML int8 · 약 99MB</text>
  <line x1="366" y1="423" x2="614" y2="423" stroke="#8FE670" stroke-width="1"/>
  <text x="366" y="458" class="item-inverse">CTC 확률 + 제시문 토큰</text>
  <line x1="366" y1="477" x2="614" y2="477" stroke="#8FE670" stroke-width="1"/>
  <text x="366" y="512" class="item-inverse">동적 계획법으로 위치 탐색</text>
  <text x="366" y="572" class="copy-inverse">무슨 말인지 추측하는 대신,</text>
  <text x="366" y="596" class="copy-inverse">알고 있는 문장의 각 음절이</text>
  <text x="366" y="620" class="copy-inverse">언제 발음됐는지 찾습니다.</text>

  <rect x="670" y="198" width="324" height="490" rx="22" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="692" y="246" class="step">03</text>
  <text x="692" y="294" class="card-title">운율 분석</text>
  <text x="692" y="350" class="item">화자 맞춤 2-pass 음높이</text><line x1="692" y1="369" x2="972" y2="369" class="rule"/>
  <text x="692" y="404" class="item">중앙 음높이 기준 반음 변환</text><line x1="692" y1="423" x2="972" y2="423" class="rule"/>
  <text x="692" y="458" class="item">피치 · 길이 · 리듬</text><line x1="692" y1="477" x2="972" y2="477" class="rule"/>
  <text x="692" y="512" class="item">9개 발화 특징 계산</text>
  <text x="692" y="572" class="copy">화자의 기본 목소리 높이에 맞춰</text>
  <text x="692" y="596" class="copy">음역을 다시 잡고, 음절 길이까지</text>
  <text x="692" y="620" class="copy">고려해 상승과 하강을 판정합니다.</text>

  <rect x="1028" y="198" width="292" height="490" rx="22" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="1050" y="246" class="step">04</text>
  <text x="1050" y="294" class="card-title">특징 해석</text>
  <text x="1050" y="350" class="item">상승 억양</text><line x1="1050" y1="369" x2="1298" y2="369" class="rule"/>
  <text x="1050" y="404" class="item">긴 음절</text><line x1="1050" y1="423" x2="1298" y2="423" class="rule"/>
  <text x="1050" y="458" class="item">강한 리듬 변화</text><line x1="1050" y1="477" x2="1298" y2="477" class="rule"/>
  <text x="1050" y="512" class="item">음절별 상승 · 하강 · 평탄</text>
  <text x="1050" y="572" class="copy">방언 점수가 아니라 녹음에서</text>
  <text x="1050" y="596" class="copy">실제로 관찰된 말투의 특징을</text>
  <text x="1050" y="620" class="copy">이해하기 쉬운 말로 보여줍니다.</text>

  <rect x="1354" y="198" width="382" height="490" rx="22" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2"/>
  <text x="1376" y="246" class="step">05</text>
  <text x="1376" y="294" class="card-title">다감각 경험 생성</text>
  <text x="1376" y="350" class="item">구조화된 Dialect Root</text><line x1="1376" y1="369" x2="1714" y2="369" class="rule"/>
  <text x="1376" y="404" class="item">음절 타이밍 · 피치 · AHAP</text>
  <rect x="1376" y="444" width="154" height="46" rx="12" fill="#F6F6F6" stroke="#D6D4D1"/>
  <text x="1453" y="473" text-anchor="middle" class="pill">글자의 움직임</text>
  <rect x="1542" y="444" width="154" height="46" rx="12" fill="#F6F6F6" stroke="#D6D4D1"/>
  <text x="1619" y="473" text-anchor="middle" class="pill">햅틱</text>
  <rect x="1376" y="502" width="154" height="46" rx="12" fill="#F6F6F6" stroke="#D6D4D1"/>
  <text x="1453" y="531" text-anchor="middle" class="pill">원본 음성</text>
  <rect x="1542" y="502" width="154" height="46" rx="12" fill="#F6F6F6" stroke="#D6D4D1"/>
  <text x="1619" y="531" text-anchor="middle" class="pill">아카이브</text>
  <text x="1376" y="596" class="copy">같은 음향 특징이 모든 출력을</text>
  <text x="1376" y="620" class="copy">움직입니다. UI가 별도의 장식값을</text>
  <text x="1376" y="644" class="copy">임의로 만들지 않습니다.</text>

  <rect x="36" y="744" width="1728" height="188" rx="28" fill="#1B1A18"/>
  <text x="66" y="794" class="card-title-inverse">실제 방언 음성으로 검증</text>
  <text x="66" y="822" class="copy-inverse">Python 기준과 Core ML · Swift 결과를 비교합니다.</text>
  <line x1="400" y1="778" x2="400" y2="900" stroke="#56524B"/>
  <text x="430" y="814" class="metric">600</text><text x="430" y="842" class="metric-label">AI-HUB 경상도 실발화</text>
  <line x1="672" y1="778" x2="672" y2="900" stroke="#56524B"/>
  <text x="702" y="814" class="metric">36ms</text><text x="702" y="842" class="metric-label">음절 시작 오차 중앙값</text>
  <line x1="944" y1="778" x2="944" y2="900" stroke="#56524B"/>
  <text x="974" y="814" class="metric">91%</text><text x="974" y="842" class="metric-label">100ms 이내 시작점</text>
  <line x1="1216" y1="778" x2="1216" y2="900" stroke="#56524B"/>
  <text x="1246" y="814" class="metric">98.6%</text><text x="1246" y="842" class="metric-label">INT8 시작 프레임 일치율</text>
  <line x1="1488" y1="778" x2="1488" y2="900" stroke="#56524B"/>
  <text x="1518" y="814" class="metric">99.3%</text><text x="1518" y="842" class="metric-label">INT8 라벨 일치율</text>
  <rect x="36" y="958" width="640" height="4" rx="2" fill="#129034"/><rect x="676" y="958" width="1088" height="4" rx="2" fill="#E7E6E5"/>
</svg>
